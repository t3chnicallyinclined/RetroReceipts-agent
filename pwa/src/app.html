<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<!-- ?v=2 is a cache-buster, not decoration. Browsers cache favicons in their own store, separate from
		     the page cache, and a hard refresh does NOT reliably evict it — anyone who visited while the mark
		     was still the MetaSync "M" keeps seeing the M indefinitely. Changing the URL is the only reliable
		     way to force a re-fetch for everyone. Bump it whenever the icon art changes. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg?v=2" />
		<!-- iOS ignores an SVG apple-touch-icon, so this one must be a PNG (built by scripts/build-icons.mjs). -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png?v=2" />
		<!-- Linked by hand on purpose: this project never wires up vite-plugin-pwa's pwaInfo helper, so
		     nothing was injecting it and the browser never saw the manifest at all — which is why an
		     installed shortcut fell back to a generated tile instead of the app's name and icon. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0a0c12" />
		<meta name="description" content="Marvel vs Capcom 2 — live ranks, tournaments & stats." />
		<!-- Link previews (Discord/Facebook/X). ⚠ Scrapers do NOT run JS, so these STATIC tags are what a
		     shared link shows; URLs must be ABSOLUTE (scrapers resolve nothing).
		     ⚠ THESE ARE THE FALLBACK, NOT THE MAIN PATH. nginx routes the known scraper user-agents
		     (Facebook/Twitter/Discord/Slack/WhatsApp/Telegram/LinkedIn) for ALL of /app/* to the server's
		     og_preview(), which emits PER-ROUTE title/description/image; those bots never see this file.
		     What lands here is everything nginx does not match — reddit, iMessage/Safari-style fetchers —
		     and since the PWA is an SPA with one shared shell for every route (svelte.config.js
		     `fallback: index.html`), this can only ever say one generic thing.
		     ⚠ So it MUST stay word-for-word identical to og_preview()'s DEFAULT branch in
		     RetroReceipts-server/server/src/routes.rs — otherwise the same page tells two different
		     stories depending on which scraper fetched it. Change one, change the other.
		     No og:url here on purpose: it would be wrong on every route but one. -->
		<meta property="og:site_name" content="Retro Receipts" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Retro Receipts" />
		<meta property="og:description" content="MvC2 ranked, receipts, and money matches — the arcade's live stats." />
		<meta property="og:image" content="https://nobd.net/app/og-card.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Retro Receipts" />
		<meta name="twitter:image" content="https://nobd.net/app/og-card.png" />
		<script>
			// Steam OpenID returns #token&steamid in the URL fragment. Capture it HERE — inline in the
			// shell head, before any app bundle / route / service worker runs — so sign-in works even
			// when a stale cached SW serves an outdated shell (the return-404 bug). Self-contained +
			// idempotent; the auth store then hydrates from localStorage on boot.
			(function () {
				try {
					var h = location.hash || '';
					if (h.indexOf('token=') === -1) return;
					var p = new URLSearchParams(h.charAt(0) === '#' ? h.slice(1) : h);
					var t = p.get('token'),
						s = p.get('steamid');
					if (t && s && /^\d{17}$/.test(s)) {
						localStorage.setItem('rr_token', t);
						localStorage.setItem('rr_steamid', s);
					}
					history.replaceState(null, '', location.pathname + location.search);
				} catch (e) {}
			})();
			// Theme: default DARK (hardcoded on <html> as the no-JS fallback); a saved 'light'/'auto' wins.
			// Runs before first paint → no flash.
			(function () {
				try {
					var t = localStorage.getItem('rr_theme') || localStorage.getItem('metasync_theme') || 'dark';
					if (t === 'auto') document.documentElement.removeAttribute('data-theme');
					else document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
