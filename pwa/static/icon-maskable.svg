<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff6a3d"/>
    </linearGradient>
  </defs>
  <!-- full-bleed: the OS applies its own mask shape; content stays in the center ~80% safe zone -->
  <rect x="0" y="0" width="512" height="512" fill="url(#mk)"/>
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="'Arial Black','Helvetica Neue',system-ui,sans-serif" font-weight="900"
        font-style="italic" font-size="204" letter-spacing="-14" fill="#241700">RR</text>
</svg>
