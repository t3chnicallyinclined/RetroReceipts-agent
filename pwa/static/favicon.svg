<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="fav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff5c2c"/>
    </linearGradient>
  </defs>
  <!-- favicon: the torn-receipt Stub, drawn FULL-BLEED (the paper is the icon — no container, no margin).
       The tear teeth are cut out of the top/bottom edges rather than sitting inside padding, so the mark
       spans 96 of 100 units wide. Print is bolder than icon.svg because this renders at 16px. -->
  <path d="M2 10 l6 -6 6 6 l6 -6 6 6 l6 -6 6 6 l6 -6 6 6 l6 -6 6 6 l6 -6 6 6 l6 -6 6 6 l6 -6 6 6 L98 90 l-6 6 -6 -6 l-6 6 -6 -6 l-6 6 -6 -6 l-6 6 -6 -6 l-6 6 -6 -6 l-6 6 -6 -6 l-6 6 -6 -6 l-6 6 -6 -6 Z" fill="url(#fav)"/>
  <text x="50" y="29" text-anchor="middle" dominant-baseline="central" font-family="'Arial Black','Helvetica Neue',system-ui,sans-serif" font-weight="900" font-style="italic" font-size="34" letter-spacing="-3" fill="#0a0c12">RR</text>
  <rect x="12" y="48" width="76" height="8" rx="4" fill="#0a0c12"/>
  <rect x="12" y="61" width="50" height="8" rx="4" fill="#0a0c12"/>
  <!-- barcode: few, thick stripes so it stays stripes at 16px instead of blurring to a grey band -->
  <g fill="#0a0c12">
    <rect x="12" y="75" width="7" height="13"/>
    <rect x="25" y="75" width="5" height="13"/>
    <rect x="36" y="75" width="9" height="13"/>
    <rect x="51" y="75" width="5" height="13"/>
    <rect x="62" y="75" width="9" height="13"/>
    <rect x="77" y="75" width="7" height="13"/>
  </g>
</svg>
