<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="rr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff5c2c"/>
    </linearGradient>
  </defs>
  <!-- The Stub: the whole icon IS a torn receipt — perforated top + bottom, RR merchant header, itemized
       lines, barcode. Drawn FULL-BLEED: the paper spans 96 of 100 units, with the tear teeth cut out of the
       edges instead of floating inside padding. Used for apple-touch-icon and the PWA "any" purpose, where
       the platform supplies its own container, so the mark should not build one of its own. -->
  <path d="M2 10 l6 -6 6 6 l6 -6 6 6 l6 -6 6 6 l6 -6 6 6 l6 -6 6 6 l6 -6 6 6 l6 -6 6 6 l6 -6 6 6 L98 90 l-6 6 -6 -6 l-6 6 -6 -6 l-6 6 -6 -6 l-6 6 -6 -6 l-6 6 -6 -6 l-6 6 -6 -6 l-6 6 -6 -6 l-6 6 -6 -6 Z" fill="url(#rr)"/>
  <text x="50" y="28" text-anchor="middle" dominant-baseline="central" font-family="'Arial Black','Helvetica Neue',system-ui,sans-serif" font-weight="900" font-style="italic" font-size="32" letter-spacing="-3" fill="#0a0c12">RR</text>
  <rect x="12" y="47" width="76" height="7" rx="3.5" fill="#0a0c12"/>
  <rect x="12" y="59" width="52" height="7" rx="3.5" fill="#0a0c12"/>
  <g fill="#0a0c12">
