[package]
name = "rr-agent"
version = "0.3.43"  # 0.3.43 = PER-TICK BLOCK SNAPSHOT: one 211,736-B read of the GGPO block per frame, served to every in-block read_at (fighters, draw-list nodes, world nodes) -- was 500-800 small RPM reads/frame = ~90% of a core in a match. Coherent (one instant), same bytes recorded; cleared every poll so the clock and rollback spin-reads stay live; refreshed per torn-list retry. PREVIOUS:  # 0.3.42 = CPU: the 0.5 ms clock poll now costs one 4-byte read; the GGPO input harvest, the per-frame closure and array_valid run once per TICK (were per poll = ~16k syscalls/s, ~140% of a core with the game open on 0.3.39..0.3.41). PREVIOUS:  # 0.3.41 = world-object caps raised (AOBJ_MAX_BYTES 4 KB -> 128 KB, AOBJ_MAX_RECS 8 -> 128): every stage prop with more than ~6 meshes was truncated in the tape (stage 16: 9..18-mesh models shipped 5..7 records = part of the background missing). Objects are interned once per match so the per-frame cost is unchanged. PREVIOUS:  # 0.3.40 = PALETTE STAGING ROWS (docs/PALETTE-SOURCE-GHIDRA.md, Ghidra-confirmed, gate 494/518 LUT pages byte-exact): per frame one 0x540-B read of the engine-resolved 16-colour palette rows at blk+0x13C0 (6 slots x 8 rows, +flags), interned through `pals` as `palrows` (148 B/frame) -- the bound palette is the staged bank row, NOT DatPal (costume 0 row 0), which is why same-character mirrors rendered alike. APPENDED keys; old consumers ignore them. PREVIOUS:  # 0.3.39 = the render-state residuals, all Ghidra-derived (docs/WORLD-CAMERA-GHIDRA.md, STAGE-DRAW-GHIDRA.md, TSP-RENDER-STATE-GHIDRA.md): world nodes carry the node+0x90 ALPHA MULTIPLIER (anodes_stride 100, appended), rows carry the camera STATE (blk+0x6908) + look-at/fov/y-offset/roll so a scripted camera renders exactly, the deck colour multiplier (blk+0x6CA8) and the blackout gate (blk+0x3D50). Columns/records APPENDED; consumers read anodes_stride/schema. PREVIOUS:  # 0.3.38 = gfx1/gfx2 read from the offsets Steam's own sprite submit dereferences (+0x1A8 GFX1 table, +0x1B0 GFX2 cell table; +0x1A0/+0x1A4 were animation-state words) and a RAW owner link per node (u32 blk-relative offset of *(H+0x28), nodes_enc stride 54) so object->object->fighter chains resolve offline. PREVIOUS:  # 0.3.37 = +zoom column (blk+0x691C, appended) and the TORN-LIST RETRY (a stub draw list where the previous frame had 3+ nodes is re-read at 1 ms steps, bounded 6; END trace reports torn_retries) -- the first v5 tape had 88 torn + 30 missing lists in 5619 frames. PREVIOUS:  # 0.3.36 = stage_id read from blk+0x6D04 (0x6D3C was 0 in every capture; 0x6D04 = 0x0B in training, the field Steam's render dispatcher tests). PREVIOUS:  # 0.3.35 = TAPE v5 (renderer lane): the SYSTEM-A world-space class joins the tape -- per frame every drawn node of the game's second render system (blk+0x2EDE8 lists 5..13: shadows, 1P/2P markers, super glows, hail chunks, HUD, stage props) as {list, flags, 4x4 matrix (== Steam CBWorld transposed), colour, model ptr, object index} (96 B) + the interned DC-TA polygon-list objects read through node+0xA0 (TCW = texture id, 32-B vertices == Steam VB). New keys anodes/aobjs/anodes_stride/aobjs_n/tape_ver=5; nodes_enc unchanged (v4). PREVIOUS:  # 0.3.34 = TAPE v4 (renderer lane): nodes_enc record 44B->50B APPEND-ONLY (+u16 angle H+0x148 = the SH4 rotation angle, 0x10000=360deg -- NOT a bit-15 flag; +i16 hotx/hoty H+0x178 = the rotation pivot), `nodes_stride`/`nodes_ver` keys so consumers accept 44 and 50; EDGE-TRIGGERED SAMPLING -- the capture loop polls the 4 B frame clock at 0.5 ms and reads the draw list the moment it ticks, making the read phase vs the render walk DETERMINISTIC (v3 tapes mixed frame N sim state with frame N-1 screen placement at random). Offline: 30/30 Steam captures at 100.000% incl. supers. PREVIOUS:  # 0.3.32 = FULL EFFECT WIRE (renderer lane). objs record 20B->32B, APPEND-ONLY: per-node is_effect (blk+0x6CE8 value-test) + blend (computeObjectBlend nibble) + drawn (H+0x170) + atimer (H+0x186) + scaleY zy (H+0x134 x4096) + effect_key (in-bank gfx low16) + depth (H+0x12C f32, DC node+0xE8, byte-exact z). Lets Path-A render bright additive supers/beams/the Inferno pillar; carries the discriminators to derive the ownerless-effect->atlas binding offline. Older tapes (16/20B) still decode. PREVIOUS:  # 0.3.31 = TRAY MENU IS THE ONLY UI (Tris 2026-08-29). Reverts the unreleased 0.3.30 Coin Door: the agent is a tray helper, not a second app. All stats/rank/records live in the PWA (nobd.net/app); the agent surfaces only what the web can't -- live status, signed-in identity, and the local-only controls (skins / pause / host / check-for-updates / logs / bug report / start-with-system / quit) -- in the native tray menu, ATTACHED ON ALL PLATFORMS again (0.3.30 had detached it on Windows/macOS to force the GUI). Drops the eframe/egui + wgpu dependency the Coin Door pulled in (smaller binary; no GPU/windowing stack for a tray popup) and removes the separate --settings process, its prefs_reload/agent_cmd file channel, and settings.rs. --version still PRINTS and exits (4d965ae). NOTE: 0.3.30 was pushed to main but NEVER released (the shipped channel stayed 0.3.29), so users see no functional change vs 0.3.29 beyond the smaller binary. PREVIOUS:  # 0.3.30 = (UNRELEASED, reverted by 0.3.31) the Coin Door native settings GUI. PREVIOUS:  # 0.3.29 = EFFECTS/SATELLITES TAPE FIX (renderer lane) + local-spool byte-cap. The objs column (on-screen effects/projectiles/satellites) reproduces again — 0.3.28 shipped it garbage (0/23742 nodes resolved, owner=255, scale const 426.625). Fix, all live-confirmed: owner -> u64 H+0x28 (the owning fighter's H-base, was always 255); gfx1 -> H+0x1A0 + gfx2 -> H+0x1A4 (H+0x1A8 was Dat_Pal, a palette handle — why it never resolved); scale decode /4096 not /16 (the 426.625 bug). + p2_meter_fill + round_no columns + a self-describing objs calibration blob. Graded live: 48k nodes resolve, real owners, scale 1.667. Captures SPRITE-class effects only (3D hit sparks are a later cut). ALSO 45's spool fix: the local tape spool is capped by BYTES (250MB) and evicts oldest instead of refusing newest, so a user who filled the spool offline stops silently losing every later match. PREVIOUS:  # 0.3.28 = RE-SIMULATION TAPE SHIPPED TO BETA — 0.3.24's capture work finalized (frame counter rebuilt off blk+0x3CC8, rollback-aware; hunt_frame_counter deleted; sx/sy/zx/zy/flash/glow/layer/timer columns appended after seat_in) + merged with the Coin Door, skins-opt-in, THE WALL + self-retire legacy migration, and N5 referee observability. Beta channel only (agent-latest stays 0.3.23). Real server tapes grade 99.4-100%. PREVIOUS:  # 0.3.24 = RE-SIMULATION CAPTURE — the tape stops DESCRIBING a match and starts REPRODUCING it. MARVEL vs CAPCOM Fighting Collection ships verbatim GGPO rollback, so the engine must register the region it saves/restores on every rewind — it registers exactly ONE: blk[0..0x33B18) (211,736 B; size field at exe+0xac6ef8 verified live). That region provably holds everything that CHANGES during a match — GGPO rewinds constantly online, so anything mutable outside it would desync peers, and online matches complete. ⚠ CORRECTED: that does NOT prove the region holds everything the sim READS — state written before a match and only read during it never needs restoring, so rollback-sufficiency is not replay-sufficiency. Settings and the 56-bit unlock mask ARE inside (FUN_140608690 copies them to blk+0x3C40..0x3D07 / blk+0x3CE8) and so is stage id; the open counter-example is the RNG, which on DC is an LCG ~1 MB outside the equivalent block with 54 gameplay call sites — replay-kit/verify.py settles it. Until then re-simulation is BEST-EFFORT and must not settle a money dispute. Three additions, all APPENDED: (1) seat_in[2] per frame = the AUTHORITATIVE raw pad words at G+0x218+seat*4, UPSTREAM of the 12-entry translation table — p1_in/p2_in ship cl+0x4fc, which is two stages downstream and lossy (chain measured: G+0x218 → bit table @0x140A4F780 → blk+0x3C66+i*0x14 → cl+0x4fc); (2) seat_map (G+0x258+k*4, GGPO player → seat) + rollbacks (G+0x76C) + build_id (module PE TimeDateStamp+SizeOfImage) in the envelope — KCODE_OFF was mislabelled "flycast kcode[0] (the LOCAL pad)"; it is GGPO SEAT 0's input word, and never reading the seat map is the ROOT CAUSE of the documented side-swap; (3) anchor = gzip+base64 of blk[0..0x33B18) captured at CHARACTER SELECT (~17 KB), the portable savestate a server restores before feeding seat_in[] back into a real game. ⚠ CHARACTER SELECT ONLY: a battle-state copy holds ~557 pointers into the decompressed per-character asset image and killed the game twice cross-process; at char select nothing is loaded, and that copy restored into a different process with blk moved 36 MB (804+243 pointers relocated) and the game kept running at 60 fps. Net: ~50 KB reproduces a 5-minute match EXACTLY — assists, projectiles, effects, stage and HUD included, because it is the real engine — versus ~188 KB today that can reproduce none of them; and the input stream doubles as the verification receipt for a disputed money match. Existing columns are untouched and still written, so positional consumers are unaffected. See docs/STEAM-GGPO-DETERMINISM.md. PREVIOUS:  # 0.3.23 = REPLAY COLUMNS (replay-lane spec): tape frames gain sid[6] (RAW sprite id u16 — bit15 xform flag, consumer masks), atimer[6] (anim countdown), eyeX/eyeY (camera globals blk+0x6914/18) + ground (blk+0x6998, block-stored not hardcoded) — schema string updated, columns APPENDED so positional consumers of old columns are unaffected. Screen coords deliberately NOT shipped (derivable: sx=320+(wx−eyeX), sy=ground−wy, sub-pixel exact on drawn objects; camera-identity gates need ~8px threshold NOT tight). With act[]=draw-gate from 0.3.22, tapes are now fully replayable. PREVIOUS:  # 0.3.22 = TAPE KINEMATICS FIXED — the 0x16C off-by-one (replay lane discovery, ported VERBATIM from mvc-live-skins-quarters @5927e9e): the slot base is 0x16C INSIDE the true object, so every offset ≥0x5CC (px/py/vx/vy/facing/act/cr) read the NEXT character — every prior tape's position data belongs to the wrong fighter. Now read from H = cl−0x16C (px 0x50/py 0x54/vx 0x78/vy 0x7c/face 0x154); act[] repurposed to the engine draw gate H+0x170; cr[] ships zeros (receive = opponent's cd). Fields <0x5CC (hp/red/char_id/combo/hitstun/assist/input/DatPal) were ALWAYS correct — skins, W/L, and the receipt stats layer unaffected. Motion probes retargeted. PREVIOUS:  # 0.3.21 = heartbeat reports the Skin-sync toggle ("skins": bool) so the web app can SHOW whether in-game painting is on (AccountMenu agent row + a loud Locker banner when OFF; server /rr/agent echoes it — old servers ignore the field harmlessly). Clarified semantics: sync OFF = the painter writes NOTHING (you see no custom skins in-game, yours or theirs); OTHER players still see your colors (each viewer's own agent paints them) and the web always renders skins. PREVIOUS:  # 0.3.20 = QoL: tray toggle renamed "Skin sync — show custom skins in game" (stats-only users can find the off switch; unchecked = palettes never touched, stats unaffected) + auto-update recheck 3h→1h (updates have ALWAYS self-applied without clicks — launch check + periodic, applies when safe or next launch; the toast is only the deferred-mid-match case). PREVIOUS:  # 0.3.19 = GHOST CLASS DEAD, ALL PATHS: the cabinet re-ghosted THROUGH find_opponent_netplay (0.3.14 gated only the lobby scan) — a lobby member's SteamID co-locates with the host's in Steam session structures closely enough to satisfy best_pair's ≥2-within-0x400 rule, so mere membership forged a "ranked pairing" at the menu (trace: state=menu roster=[] opp locked). Now: (1) UNIVERSAL match-activity gate — NO new opponent lock on ANY path without fighters loading or a just-seen live fight (ranked lock lands a few seconds later, at fighters-load); (2) in_session NEVER counts toward `active` — a still-resolving pairing is what stale looks like, OUT_TIMEOUT is the sole between-games bridge; (3) HOST_MODE boxes never POST /match/live — a cabinet referees from a spectator seat and must never claim to be in a match (its roster reads live during refereed games, which would reopen the gate). PREVIOUS:  # 0.3.18 = THE SSOT-AUDIT RELIABILITY BATCH (the 5 queued reader risks): (1) DETERMINISTIC opponent tie-break — best_pair/name_of_opp resolved equal scores by HashMap iteration order, a different winner per scan (the flap source the anti-flip layer was fighting); ties now break by sid / lexicographic. (2) st.teams NO LONGER freeze-on-first — a full 3v3 read is truth and refreshes freely (first-cycle partial/stale rosters shipped phantom teams in /result), partial reads only fill empty. (3) tray score is CALLER-RELATIVE when side confirmed ("vs X (mine-theirs)"; raw P1,P2 showed the opponent first from side 2). (4) self-ident cache resets on NEW game pid — a forever-OnceLock kept reporting the OLD account after a Steam account switch. (5) tape local_pn vs verdict side divergence now TRACED at report time (observability, not fiat unification — the Duc lesson). PREVIOUS:  # 0.3.17 = OPPONENT NAMES NEVER LEAVE THE MACHINE (Tris directive): /result now sends the opponent side id-only, ALWAYS — the scraped name is demoted to scan-validator (a name-shaped run beside a candidate id proves a real player record) + local tray/H2H label. The server resolves every display name itself (records → Steam Web API). Our OWN name (file-sourced loginusers.vdf, not memory) still rides for server name-freshness. Closes the pollution path 0.3.16's finisher narrowed. PREVIOUS:  # 0.3.16 = KILLS THE MOJIBAKE NAME CLASS ("Mn�o.��y" / "G��'J�v‹E" on prod 2026-08-25): the memory scrape windows can bisect a multibyte UTF-8 char ANYWHERE, but the two name finishers stripped U+FFFD only at the EDGES — interior damage shipped, cached in the sticky opponent, and polluted server name records. ONE shared finisher (finish_scraped_name, unit-tested) now rejects any interior U+FFFD → name goes out EMPTY (id-only; supported since 0.3.13 — the server resolves display names from Steam itself, so unresolved beats wrong). Also: bug-report meta now carries source:"tray"|"cli" so CLI reports' default uptime/degraded fields aren't read as live tray state. PREVIOUS:  # 0.3.15 = BUG REPORTS + CRASH FORENSICS: tray "Send a bug report" (also `--bugreport` CLI for when the tray itself is broken) bundles os/hw info + a live status meta snapshot + log tails from the CURRENT **and PREVIOUS** run into gzip → POST /rr/bugreport (token-auth; server stores under bugreports/, 200 cap). Enablers: Windows stderr now goes to runtime_dir()/stderr.log rotated to .1 per launch (a windows_subsystem tray has NO console — panics/updater lines were silently DISCARDED, which is why crashes were undiagnosable), and suite_trace.log now ROTATES to .1 at its 1MB cap instead of wiping (a wipe right before a crash destroyed exactly the evidence). Linux keeps journald; reports pull both boots via journalctl. PREVIOUS:  # 0.3.14 = KILLS THE LOBBY GHOST PAIRING: a member merely sitting in a hosted lobby was locked as the "opponent" (find_opponent_lobby's gate was hosted+netsess, true on ANY join) and broadcast to /match/live — so the auto-host cabinet showed "NOBD_Arcade VS <random joiner>" in Now Playing with no match; worse, the hold pinned itself alive (lobby resolve → in_session → active → OUT_TIMEOUT never fired, and a freed-heap MemberInfo ghost kept re-validating after the member LEFT) so the card stuck forever. Now: a NEW lobby-path opponent locks only with real match activity (fighters loading / recent live fight); a lobby-sourced in_session no longer counts as activity, so a dead hold expires via OUT_TIMEOUT and the closed re-lock gate keeps the ghost from returning. Ranked netplay pairing unchanged. PREVIOUS:  # 0.3.13 = FIXES SILENT RESULT LOSS vs unnamed opponents: an opponent whose MemberInfo name never resolves (empty string) was refused by the junk-name gate, so EVERY game vs them skipped client-side (no elo, no receipts, no stats — seen live vs OMEN 2026-08-24). Empty now passes (id-only report; server resolves display names); junk names still refused. PREVIOUS:  # 0.3.12 = gs-110 MATCH STATS: /result now carries a per-game stats object computed from the frame tape (true damage, chip via hitstun-flag, KOs/deaths, meter built, first blood, biggest-combo OWNER, 48-pt momentum line) + the assist types captured since char-select snapshotting. Needs server storage to surface; harmlessly ignored until then. PREVIOUS:  # 0.3.11 = updates can now install while MvC2 is OPEN, as long as nothing is in flight (menu, no pairing, no opponent). The old gate was "game closed", which is stricter than the real risk and meant anyone who leaves the game running never updated. PREVIOUS:  # 0.3.10 = FIXES WINDOWS SELF-UPDATE, broken by 0.3.8. Its state-dir migration renamed %LOCALAPPDATA%\MetaSync -> \RetroReceipts WHILE THE AGENT RAN, so current_exe() named a directory that no longer existed: self_replace died with "os error 3" (installs could never update again) and the autostart Run entry got the dead path written into it (no start after reboot). Both now resolve through config::live_exe_path(), and self-update falls back to swapping the binary at its real location. PREVIOUS:  # 0.3.9 = /match/live fires from the LOBBY (in_session), not only once fighters load → peers see the live VS card + ratings/H2H the moment you are paired; full-bleed tray icon (was drawn at 44% of canvas). PREVIOUS:  # LOCKSTEP with the Retro Receipts release train (latest.json / GitHub release). 0.3.8 = INTERNAL RENAME: binary metasync-agent→rr-agent, API base /skinsync→/rr, state dir %LOCALAPPDATA%\MetaSync→\RetroReceipts + autostart key + .desktop (all MIGRATED on first run — no logout/double-launch), updater AUMID→"Retro Receipts", + "The Stub" tray receipt icon. Single-instance mutex name KEPT (shared name = safe old↔new handoff during fleet self-update). Self-replace is name-agnostic so old installs keep the metasync-agent.exe filename but run rr-agent code.
description = "Retro Receipts tray agent (rr-agent) — headless tray companion that reads MvC2 memory, applies skins, and reports matches"
authors = ["tristech"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "rr-agent"
path = "src/main.rs"

[dependencies]
# Tray shell — icon + native menu + event loop. tray-icon 0.24 depends on muda ^0.19.1, so these resolve
# together; tao provides the winit-style event loop the tray + menu pump their events into.
#
# CROSS-PLATFORM: all three are cross-platform and need NO extra Rust deps for Linux — on target_os="linux"
# they pull their own native bindings transitively (tray-icon → libappindicator + gtk; tao → gtk; muda → gtk +
# libxdo; appindicator → libdbus). No tray dep is added under [target.'cfg(target_os="linux")'] here because
# nothing is missing from that tree. The Bazzite/Fedora BUILD box does need the matching -devel system
# packages (build-env, not crates): gtk3-devel, libayatana-appindicator-gtk3-devel, libxdo-devel, dbus-devel,
# pkgconf-pkg-config (Debian/Ubuntu: libgtk-3-dev, libayatana-appindicator3-dev, libxdo-dev, libdbus-1-dev,
# pkg-config). Tray creation already happens AFTER the tao event loop inits gtk (built on StartCause::Init in
# tray.rs), matching tray-icon's Linux/winit example ordering.
tray-icon = "0.24"
muda = "0.19"
tao = "0.36"

# Opens https://nobd.net/app in the user's default browser (no window of our own).
open = "5"

# NON-MODAL update heads-up: a real OS toast/balloon (Windows Action-Center toast + Linux libnotify/dbus) so
# a deferred update (MvC2 open) can be surfaced WITHOUT a focus-stealing MessageBox mid-match. Cross-platform:
# on Linux it uses the session dbus (DBUS_SESSION_BUS_ADDRESS, present under the systemd --user service); on
# Windows it shows a WinRT toast. See updater::toast. (The modal MessageBox path — updater::notify — stays for
# the "updated—restarting" / "update failed" outcomes.)
notify-rust = "4"

# Self-updater skeleton (T1): fetch the manifest + signed binary, verify the minisign signature, swap the exe.
# Also the reader's HTTP client (T2): result / heartbeat / live-match / register + gamestate uploads.
ureq = { version = "2", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minisign-verify = "0.2"
self-replace = "1"

# T2: gzip the per-frame gamestate recording before upload (spool_gamestate), ported verbatim from the app.
flate2 = "1"

# minisign .sig files from `cargo tauri signer sign` are base64-encoded (Tauri convention); the self-updater
# base64-decodes them back to raw minisign text before verifying. See updater::verify_signature.
base64 = "0.22"

# Windows-only: process-memory + toolhelp APIs used by mem.rs (ported verbatim from src-tauri). Same version
# + feature set as the shipped app so the proven RE compiles byte-for-byte. Autostart uses winreg (below),
# so the Registry/Shell features are intentionally NOT pulled here — kept minimal.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  # T2: HKCU reads for the local Steam identity (ActiveUser account id + persona) — reg_dword / reg_string.
  "Win32_System_Registry",
  # Single-instance guard: CreateMutexW is gated behind Win32_Security (its first arg is SECURITY_ATTRIBUTES,
  # which we pass as NULL). Needed for the named-mutex guard in single_instance.rs.
  "Win32_Security",
  # Update-result popup (MessageBoxW) so the user sees "updated / failed" without re-opening the tray menu.
  "Win32_UI_WindowsAndMessaging",
  # Bug reports: SetStdHandle (stderr → runtime_dir()/stderr.log — a windows_subsystem tray has no console,
  # so panics/updater lines were lost) + GlobalMemoryStatusEx (total RAM in the report's meta).
  "Win32_System_Console",
  "Win32_System_SystemInformation",
] }
# HKCU\...\Run autostart key — far simpler than the raw windows-crate registry API.
winreg = "0.55"

# Unix (Linux/Proton) only: keeps mem.rs's #[cfg(unix)] backend compilable if ever cross-built. The agent
# itself is Windows-only, so this is never exercised on the shipping target — it only preserves mem.rs verbatim.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
# Match the app's beta profile: fast compiles, agent is I/O-bound so heavy opt buys ~nothing at runtime.
codegen-units = 16
lto = false
opt-level = 1
strip = true
