[package]
name = "rr-agent"
version = "0.3.24"  # 0.3.24 = RE-SIMULATION CAPTURE — the tape stops DESCRIBING a match and starts REPRODUCING it. MARVEL vs CAPCOM Fighting Collection ships verbatim GGPO rollback, so the engine must register the region it saves/restores on every rewind — it registers exactly ONE: blk[0..0x33B18) (211,736 B; size field at exe+0xac6ef8 verified live). That region IS the complete deterministic simulation state, certified by Capcom's own shipping netcode rather than inferred: online matches complete, so nothing sim-relevant can live outside it. Three additions, all APPENDED: (1) seat_in[2] per frame = the AUTHORITATIVE raw pad words at G+0x218+seat*4, UPSTREAM of the 12-entry translation table — p1_in/p2_in ship cl+0x4fc, which is two stages downstream and lossy (chain measured: G+0x218 → bit table @0x140A4F780 → blk+0x3C66+i*0x14 → cl+0x4fc); (2) seat_map (G+0x258+k*4, GGPO player → seat) + rollbacks (G+0x76C) + build_id (module PE TimeDateStamp+SizeOfImage) in the envelope — KCODE_OFF was mislabelled "flycast kcode[0] (the LOCAL pad)"; it is GGPO SEAT 0's input word, and never reading the seat map is the ROOT CAUSE of the documented side-swap; (3) anchor = gzip+base64 of blk[0..0x33B18) captured at CHARACTER SELECT (~17 KB), the portable savestate a server restores before feeding seat_in[] back into a real game. ⚠ CHARACTER SELECT ONLY: a battle-state copy holds ~557 pointers into the decompressed per-character asset image and killed the game twice cross-process; at char select nothing is loaded, and that copy restored into a different process with blk moved 36 MB (804+243 pointers relocated) and the game kept running at 60 fps. Net: ~50 KB reproduces a 5-minute match EXACTLY — assists, projectiles, effects, stage and HUD included, because it is the real engine — versus ~188 KB today that can reproduce none of them; and the input stream doubles as the verification receipt for a disputed money match. Existing columns are untouched and still written, so positional consumers are unaffected. See docs/STEAM-GGPO-DETERMINISM.md. PREVIOUS:  # 0.3.23 = REPLAY COLUMNS (replay-lane spec): tape frames gain sid[6] (RAW sprite id u16 — bit15 xform flag, consumer masks), atimer[6] (anim countdown), eyeX/eyeY (camera globals blk+0x6914/18) + ground (blk+0x6998, block-stored not hardcoded) — schema string updated, columns APPENDED so positional consumers of old columns are unaffected. Screen coords deliberately NOT shipped (derivable: sx=320+(wx−eyeX), sy=ground−wy, sub-pixel exact on drawn objects; camera-identity gates need ~8px threshold NOT tight). With act[]=draw-gate from 0.3.22, tapes are now fully replayable. PREVIOUS:  # 0.3.22 = TAPE KINEMATICS FIXED — the 0x16C off-by-one (replay lane discovery, ported VERBATIM from mvc-live-skins-quarters @5927e9e): the slot base is 0x16C INSIDE the true object, so every offset ≥0x5CC (px/py/vx/vy/facing/act/cr) read the NEXT character — every prior tape's position data belongs to the wrong fighter. Now read from H = cl−0x16C (px 0x50/py 0x54/vx 0x78/vy 0x7c/face 0x154); act[] repurposed to the engine draw gate H+0x170; cr[] ships zeros (receive = opponent's cd). Fields <0x5CC (hp/red/char_id/combo/hitstun/assist/input/DatPal) were ALWAYS correct — skins, W/L, and the receipt stats layer unaffected. Motion probes retargeted. PREVIOUS:  # 0.3.21 = heartbeat reports the Skin-sync toggle ("skins": bool) so the web app can SHOW whether in-game painting is on (AccountMenu agent row + a loud Locker banner when OFF; server /rr/agent echoes it — old servers ignore the field harmlessly). Clarified semantics: sync OFF = the painter writes NOTHING (you see no custom skins in-game, yours or theirs); OTHER players still see your colors (each viewer's own agent paints them) and the web always renders skins. PREVIOUS:  # 0.3.20 = QoL: tray toggle renamed "Skin sync — show custom skins in game" (stats-only users can find the off switch; unchecked = palettes never touched, stats unaffected) + auto-update recheck 3h→1h (updates have ALWAYS self-applied without clicks — launch check + periodic, applies when safe or next launch; the toast is only the deferred-mid-match case). PREVIOUS:  # 0.3.19 = GHOST CLASS DEAD, ALL PATHS: the cabinet re-ghosted THROUGH find_opponent_netplay (0.3.14 gated only the lobby scan) — a lobby member's SteamID co-locates with the host's in Steam session structures closely enough to satisfy best_pair's ≥2-within-0x400 rule, so mere membership forged a "ranked pairing" at the menu (trace: state=menu roster=[] opp locked). Now: (1) UNIVERSAL match-activity gate — NO new opponent lock on ANY path without fighters loading or a just-seen live fight (ranked lock lands a few seconds later, at fighters-load); (2) in_session NEVER counts toward `active` — a still-resolving pairing is what stale looks like, OUT_TIMEOUT is the sole between-games bridge; (3) HOST_MODE boxes never POST /match/live — a cabinet referees from a spectator seat and must never claim to be in a match (its roster reads live during refereed games, which would reopen the gate). PREVIOUS:  # 0.3.18 = THE SSOT-AUDIT RELIABILITY BATCH (the 5 queued reader risks): (1) DETERMINISTIC opponent tie-break — best_pair/name_of_opp resolved equal scores by HashMap iteration order, a different winner per scan (the flap source the anti-flip layer was fighting); ties now break by sid / lexicographic. (2) st.teams NO LONGER freeze-on-first — a full 3v3 read is truth and refreshes freely (first-cycle partial/stale rosters shipped phantom teams in /result), partial reads only fill empty. (3) tray score is CALLER-RELATIVE when side confirmed ("vs X (mine-theirs)"; raw P1,P2 showed the opponent first from side 2). (4) self-ident cache resets on NEW game pid — a forever-OnceLock kept reporting the OLD account after a Steam account switch. (5) tape local_pn vs verdict side divergence now TRACED at report time (observability, not fiat unification — the Duc lesson). PREVIOUS:  # 0.3.17 = OPPONENT NAMES NEVER LEAVE THE MACHINE (Tris directive): /result now sends the opponent side id-only, ALWAYS — the scraped name is demoted to scan-validator (a name-shaped run beside a candidate id proves a real player record) + local tray/H2H label. The server resolves every display name itself (records → Steam Web API). Our OWN name (file-sourced loginusers.vdf, not memory) still rides for server name-freshness. Closes the pollution path 0.3.16's finisher narrowed. PREVIOUS:  # 0.3.16 = KILLS THE MOJIBAKE NAME CLASS ("Mn�o.��y" / "G��'J�v‹E" on prod 2026-08-25): the memory scrape windows can bisect a multibyte UTF-8 char ANYWHERE, but the two name finishers stripped U+FFFD only at the EDGES — interior damage shipped, cached in the sticky opponent, and polluted server name records. ONE shared finisher (finish_scraped_name, unit-tested) now rejects any interior U+FFFD → name goes out EMPTY (id-only; supported since 0.3.13 — the server resolves display names from Steam itself, so unresolved beats wrong). Also: bug-report meta now carries source:"tray"|"cli" so CLI reports' default uptime/degraded fields aren't read as live tray state. PREVIOUS:  # 0.3.15 = BUG REPORTS + CRASH FORENSICS: tray "Send a bug report" (also `--bugreport` CLI for when the tray itself is broken) bundles os/hw info + a live status meta snapshot + log tails from the CURRENT **and PREVIOUS** run into gzip → POST /rr/bugreport (token-auth; server stores under bugreports/, 200 cap). Enablers: Windows stderr now goes to runtime_dir()/stderr.log rotated to .1 per launch (a windows_subsystem tray has NO console — panics/updater lines were silently DISCARDED, which is why crashes were undiagnosable), and suite_trace.log now ROTATES to .1 at its 1MB cap instead of wiping (a wipe right before a crash destroyed exactly the evidence). Linux keeps journald; reports pull both boots via journalctl. PREVIOUS:  # 0.3.14 = KILLS THE LOBBY GHOST PAIRING: a member merely sitting in a hosted lobby was locked as the "opponent" (find_opponent_lobby's gate was hosted+netsess, true on ANY join) and broadcast to /match/live — so the auto-host cabinet showed "NOBD_Arcade VS <random joiner>" in Now Playing with no match; worse, the hold pinned itself alive (lobby resolve → in_session → active → OUT_TIMEOUT never fired, and a freed-heap MemberInfo ghost kept re-validating after the member LEFT) so the card stuck forever. Now: a NEW lobby-path opponent locks only with real match activity (fighters loading / recent live fight); a lobby-sourced in_session no longer counts as activity, so a dead hold expires via OUT_TIMEOUT and the closed re-lock gate keeps the ghost from returning. Ranked netplay pairing unchanged. PREVIOUS:  # 0.3.13 = FIXES SILENT RESULT LOSS vs unnamed opponents: an opponent whose MemberInfo name never resolves (empty string) was refused by the junk-name gate, so EVERY game vs them skipped client-side (no elo, no receipts, no stats — seen live vs OMEN 2026-08-24). Empty now passes (id-only report; server resolves display names); junk names still refused. PREVIOUS:  # 0.3.12 = gs-110 MATCH STATS: /result now carries a per-game stats object computed from the frame tape (true damage, chip via hitstun-flag, KOs/deaths, meter built, first blood, biggest-combo OWNER, 48-pt momentum line) + the assist types captured since char-select snapshotting. Needs server storage to surface; harmlessly ignored until then. PREVIOUS:  # 0.3.11 = updates can now install while MvC2 is OPEN, as long as nothing is in flight (menu, no pairing, no opponent). The old gate was "game closed", which is stricter than the real risk and meant anyone who leaves the game running never updated. PREVIOUS:  # 0.3.10 = FIXES WINDOWS SELF-UPDATE, broken by 0.3.8. Its state-dir migration renamed %LOCALAPPDATA%\MetaSync -> \RetroReceipts WHILE THE AGENT RAN, so current_exe() named a directory that no longer existed: self_replace died with "os error 3" (installs could never update again) and the autostart Run entry got the dead path written into it (no start after reboot). Both now resolve through config::live_exe_path(), and self-update falls back to swapping the binary at its real location. PREVIOUS:  # 0.3.9 = /match/live fires from the LOBBY (in_session), not only once fighters load → peers see the live VS card + ratings/H2H the moment you are paired; full-bleed tray icon (was drawn at 44% of canvas). PREVIOUS:  # LOCKSTEP with the Retro Receipts release train (latest.json / GitHub release). 0.3.8 = INTERNAL RENAME: binary metasync-agent→rr-agent, API base /skinsync→/rr, state dir %LOCALAPPDATA%\MetaSync→\RetroReceipts + autostart key + .desktop (all MIGRATED on first run — no logout/double-launch), updater AUMID→"Retro Receipts", + "The Stub" tray receipt icon. Single-instance mutex name KEPT (shared name = safe old↔new handoff during fleet self-update). Self-replace is name-agnostic so old installs keep the metasync-agent.exe filename but run rr-agent code.
description = "Retro Receipts tray agent (rr-agent) — headless tray companion that reads MvC2 memory, applies skins, and reports matches"
authors = ["tristech"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "rr-agent"
path = "src/main.rs"

[dependencies]
# Tray shell — icon + native menu + event loop. tray-icon 0.24 depends on muda ^0.19.1, so these resolve
# together; tao provides the winit-style event loop the tray + menu pump their events into.
#
# CROSS-PLATFORM: all three are cross-platform and need NO extra Rust deps for Linux — on target_os="linux"
# they pull their own native bindings transitively (tray-icon → libappindicator + gtk; tao → gtk; muda → gtk +
# libxdo; appindicator → libdbus). No tray dep is added under [target.'cfg(target_os="linux")'] here because
# nothing is missing from that tree. The Bazzite/Fedora BUILD box does need the matching -devel system
# packages (build-env, not crates): gtk3-devel, libayatana-appindicator-gtk3-devel, libxdo-devel, dbus-devel,
# pkgconf-pkg-config (Debian/Ubuntu: libgtk-3-dev, libayatana-appindicator3-dev, libxdo-dev, libdbus-1-dev,
# pkg-config). Tray creation already happens AFTER the tao event loop inits gtk (built on StartCause::Init in
# tray.rs), matching tray-icon's Linux/winit example ordering.
tray-icon = "0.24"
muda = "0.19"
tao = "0.36"

# Opens https://nobd.net/app in the user's default browser (no window of our own).
open = "5"

# NON-MODAL update heads-up: a real OS toast/balloon (Windows Action-Center toast + Linux libnotify/dbus) so
# a deferred update (MvC2 open) can be surfaced WITHOUT a focus-stealing MessageBox mid-match. Cross-platform:
# on Linux it uses the session dbus (DBUS_SESSION_BUS_ADDRESS, present under the systemd --user service); on
# Windows it shows a WinRT toast. See updater::toast. (The modal MessageBox path — updater::notify — stays for
# the "updated—restarting" / "update failed" outcomes.)
notify-rust = "4"

# Self-updater skeleton (T1): fetch the manifest + signed binary, verify the minisign signature, swap the exe.
# Also the reader's HTTP client (T2): result / heartbeat / live-match / register + gamestate uploads.
ureq = { version = "2", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minisign-verify = "0.2"
self-replace = "1"

# T2: gzip the per-frame gamestate recording before upload (spool_gamestate), ported verbatim from the app.
flate2 = "1"

# minisign .sig files from `cargo tauri signer sign` are base64-encoded (Tauri convention); the self-updater
# base64-decodes them back to raw minisign text before verifying. See updater::verify_signature.
base64 = "0.22"

# Windows-only: process-memory + toolhelp APIs used by mem.rs (ported verbatim from src-tauri). Same version
# + feature set as the shipped app so the proven RE compiles byte-for-byte. Autostart uses winreg (below),
# so the Registry/Shell features are intentionally NOT pulled here — kept minimal.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  # T2: HKCU reads for the local Steam identity (ActiveUser account id + persona) — reg_dword / reg_string.
  "Win32_System_Registry",
  # Single-instance guard: CreateMutexW is gated behind Win32_Security (its first arg is SECURITY_ATTRIBUTES,
  # which we pass as NULL). Needed for the named-mutex guard in single_instance.rs.
  "Win32_Security",
  # Update-result popup (MessageBoxW) so the user sees "updated / failed" without re-opening the tray menu.
  "Win32_UI_WindowsAndMessaging",
  # Bug reports: SetStdHandle (stderr → runtime_dir()/stderr.log — a windows_subsystem tray has no console,
  # so panics/updater lines were lost) + GlobalMemoryStatusEx (total RAM in the report's meta).
  "Win32_System_Console",
  "Win32_System_SystemInformation",
] }
# HKCU\...\Run autostart key — far simpler than the raw windows-crate registry API.
winreg = "0.55"

# Unix (Linux/Proton) only: keeps mem.rs's #[cfg(unix)] backend compilable if ever cross-built. The agent
# itself is Windows-only, so this is never exercised on the shipping target — it only preserves mem.rs verbatim.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
# Match the app's beta profile: fast compiles, agent is I/O-bound so heavy opt buys ~nothing at runtime.
codegen-units = 16
lto = false
opt-level = 1
strip = true
